name: Sync museums dataset

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: sync-museums
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate dataset from the published Sheet
        run: python3 scripts/sync_museums.py

      - name: Commit changes
        run: |
          git config user.name "ISA Sync"
          git config user.email "sync@elsnorkel.com"
          git add lib/data/datasets/museums-snk-2025.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync museums dataset from published Sheet"
            git push
          fi
